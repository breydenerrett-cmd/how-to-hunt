<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>How to Hunt</title>
<style>
 html,body{margin:0;height:100%;background:#12160f;color:#eadfca;
  font:16px/1.5 "Avenir Next",Optima,"Segoe UI",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;text-align:center}
 a{color:#e9ce88}
</style>
<div>
 <p id="s">Loading the newest build&hellip;</p>
 <p><a id="m" href="b/0.8.0-hunt/index.html">Tap here if it does not start</a></p>
</div>
<script>
// Cache-busted so a stale copy of this loader still finds the current build.
fetch('latest.json?t=' + Date.now(), {cache: 'no-store'})
  .then(function (r) { return r.json(); })
  .then(function (v) { location.replace(v.path); })
  .catch(function () {
    document.getElementById('s').textContent = 'Could not check for the newest build.';
  });
</script>
